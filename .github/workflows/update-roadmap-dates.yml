name: Update Project Roadmap Dates

on:
  workflow_dispatch:

jobs:
  update-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      projects: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Update Project V2 Date Fields
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_ID="PVT_kwDOQxAaNs4AAk3o"
          
          # Array of issue numbers
          ISSUES=(42 47 46 44 45 43)
          
          # Timeline data
          declare -A TIMELINE=(
            [42]="2026-01-06|2026-03-31"
            [47]="2026-01-06|2026-01-31"
            [46]="2026-02-03|2026-02-28"
            [44]="2026-02-03|2026-02-28"
            [45]="2026-03-03|2026-03-31"
            [43]="2026-01-20|2026-02-14"
          )
          
          echo "Fetching project field IDs..."
          
          # Fetch field IDs
          FIELDS=$(gh api graphql -f projectId="$PROJECT_ID" --raw-field query='query($projectId: ID!) {
            node(id: $projectId) {
              ... on ProjectV2 {
                fields(first: 20) {
                  nodes {
                    ... on ProjectV2Field {
                      id
                      name
                    }
                  }
                }
              }
            }
          }')
          
          START_DATE_FIELD=$(echo "$FIELDS" | jq -r '.data.node.fields.nodes[] | select(.name == "Start Date") | .id')
          TARGET_DATE_FIELD=$(echo "$FIELDS" | jq -r '.data.node.fields.nodes[] | select(.name == "Target Date") | .id')
          
          if [ -z "$START_DATE_FIELD" ] || [ "$START_DATE_FIELD" = "null" ]; then
            echo "ERROR: Start Date field not found"
            echo "Available fields:"
            echo "$FIELDS" | jq '.data.node.fields.nodes[]
            exit 1
          fi
          
          if [ -z "$TARGET_DATE_FIELD" ] || [ "$TARGET_DATE_FIELD" = "null" ]; then
            echo "ERROR: Target Date field not found"
            exit 1
          fi
          
          echo "Start Date field: $START_DATE_FIELD"
          echo "Target Date field: $TARGET_DATE_FIELD"
          echo ""
          
          # Update each issue
          for ISSUE_NUM in "${ISSUES[@]}"; do
            IFS='|' read -r START_DATE TARGET_DATE <<< "${TIMELINE[$ISSUE_NUM]}"
            
            echo "Processing issue #$ISSUE_NUM (Start: $START_DATE, Target: $TARGET_DATE)..."
            
            # Get issue node ID
            ISSUE_QUERY="query { repository(owner: \"zfifteen\", name: \"emergent-doom-engine\") { issue(number: $ISSUE_NUM) { id } } }"
            ISSUE_ID=$(gh api graphql --raw-field query="$ISSUE_QUERY" | jq -r '.data.repository.issue.id')
            
            if [ -z "$ISSUE_ID" ] || [ "$ISSUE_ID" = "null" ]; then
              echo "  ERROR: Could not find issue #$ISSUE_NUM"
              continue
            fi
            
            # Find project item
            ITEM_QUERY="query(\$projectId: ID!) { node(id: \$projectId) { ... on ProjectV2 { items(first: 100) { nodes { ... on ProjectV2Item { id content { ... on Issue { id } } } } } } } }"
            ITEMS=$(gh api graphql -f projectId="$PROJECT_ID" --raw-field query="$ITEM_QUERY")
            ITEM=$(echo "$ITEMS" | jq -r ".data.node.items.nodes[] | select(.content.id == \"$ISSUE_ID\") | .id")
            
            if [ -z "$ITEM" ] || [ "$ITEM" = "null" ]; then
              echo "  WARNING: Issue not in project"
              continue
            fi
            
            # Update Start Date
            START_QUERY="mutation { updateProjectV2ItemFieldValue(input: {projectId: \"$PROJECT_ID\", itemId: \"$ITEM\", fieldId: \"$START_DATE_FIELD\", value: {date: \"$START_DATE\"}}) { projectV2Item { id } } }"
            gh api graphql --raw-field query="$START_QUERY" > /dev/null 2>&1 || echo "  WARNING: Failed to set Start Date"
            
            # Update Target Date
            TARGET_QUERY="mutation { updateProjectV2ItemFieldValue(input: {projectId: \"$PROJECT_ID\", itemId: \"$ITEM\", fieldId: \"$TARGET_DATE_FIELD\", value: {date: \"$TARGET_DATE\"}}) { projectV2Item { id } } }"
            gh api graphql --raw-field query="$TARGET_QUERY" > /dev/null 2>&1 || echo "  WARNING: Failed to set Target Date"
            
            echo "  ✓ Updated"
          done
          
          echo ""
          echo "✓ Roadmap updates complete!"
