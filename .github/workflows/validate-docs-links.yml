name: Documentation Link Validation

on:
  pull_request:
    paths:
      - 'src/test/java/com/emergent/doom/**/*.md'
      - 'scripts/validate-links.py'
      - '.github/workflows/validate-docs-links.yml'
  push:
    branches:
      - main
    paths:
      - 'src/test/java/com/emergent/doom/**/*.md'
      - 'scripts/validate-links.py'
      - '.github/workflows/validate-docs-links.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  validate-links:
    name: Validate Documentation Links
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write  # Needed to comment on PRs
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run link validator
        run: |
          python3 scripts/validate-links.py --verbose
      
      - name: Comment on PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Documentation link validation failed!**\n\nPlease run `python scripts/validate-links.py` locally to see the broken links and fix them before merging.'
            })
