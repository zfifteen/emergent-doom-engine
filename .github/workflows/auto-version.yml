name: Auto Version and Release

on:
  push:
    branches: [ main ]

jobs:
  auto-version:
    runs-on: ubuntu-latest
    
    # Prevent infinite loops - skip if this commit is from the bot
    if: "!contains(github.event.head_commit.message, 'chore(release): bump version')"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Get last tag
        id: get-last-tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.3.0-alpha")
          echo "last_tag=${LAST_TAG}" >> $GITHUB_OUTPUT
          echo "Last tag: ${LAST_TAG}"
      
      - name: Get commits since last tag
        id: get-commits
        run: |
          LAST_TAG="${{ steps.get-last-tag.outputs.last_tag }}"
          if git rev-parse "${LAST_TAG}" >/dev/null 2>&1; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" || echo "")
          else
            COMMITS=$(git log HEAD --pretty=format:"%s" || echo "")
          fi
          
          # Save to multiline output
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Determine version bump type
        id: bump-type
        run: |
          COMMITS="${{ steps.get-commits.outputs.commits }}"
          
          # Check for breaking changes (major bump)
          if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|!:)"; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Detected BREAKING CHANGE - major version bump"
          # Check for features (minor bump)
          elif echo "$COMMITS" | grep -qE "^feat(\(.*\))?:"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Detected feat commits - minor version bump"
          # Default to patch bump
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Default patch version bump"
          fi
      
      - name: Get current version from pom.xml
        id: current-version
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${CURRENT_VERSION}"
      
      - name: Calculate new version
        id: new-version
        run: |
          CURRENT="${{ steps.current-version.outputs.version }}"
          BUMP="${{ steps.bump-type.outputs.bump }}"
          
          # Strip -alpha suffix for calculation
          VERSION_BASE=$(echo "$CURRENT" | sed 's/-alpha//')
          
          # Parse version components
          MAJOR=$(echo "$VERSION_BASE" | cut -d. -f1)
          MINOR=$(echo "$VERSION_BASE" | cut -d. -f2)
          PATCH=$(echo "$VERSION_BASE" | cut -d. -f3)
          
          # Bump according to type
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-alpha"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"
      
      - name: Update pom.xml version
        run: |
          NEW_VERSION="${{ steps.new-version.outputs.version }}"
          mvn versions:set -DnewVersion=${NEW_VERSION} -DgenerateBackupPoms=false
          echo "Updated pom.xml to version ${NEW_VERSION}"
      
      - name: Run Maven resource filtering
        run: |
          mvn process-resources
          echo "Maven resource filtering completed"
      
      - name: Update CHANGELOG.md
        run: |
          NEW_VERSION="${{ steps.new-version.outputs.version }}"
          LAST_TAG="${{ steps.get-last-tag.outputs.last_tag }}"
          DATE=$(date +%Y-%m-%d)
          
          # Get commits and categorize them
          if git rev-parse "${LAST_TAG}" >/dev/null 2>&1; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s|||%b")
          else
            COMMITS=$(git log HEAD --pretty=format:"%s|||%b")
          fi
          
          # Parse commits by conventional commit type
          BREAKING=""
          FEATURES=""
          FIXES=""
          DOCS=""
          CHORES=""
          OTHER=""
          
          while IFS= read -r line; do
            SUBJECT=$(echo "$line" | cut -d'|' -f1)
            BODY=$(echo "$line" | cut -d'|' -f4-)
            
            # Check for breaking changes
            if echo "$line" | grep -qE "(BREAKING CHANGE|!:)"; then
              BREAKING="${BREAKING}\n- ${SUBJECT}"
            # Features
            elif echo "$SUBJECT" | grep -qE "^feat(\(.*\))?:"; then
              CLEAN=$(echo "$SUBJECT" | sed 's/^feat[^:]*: //')
              FEATURES="${FEATURES}\n- ${CLEAN}"
            # Fixes
            elif echo "$SUBJECT" | grep -qE "^fix(\(.*\))?:"; then
              CLEAN=$(echo "$SUBJECT" | sed 's/^fix[^:]*: //')
              FIXES="${FIXES}\n- ${CLEAN}"
            # Documentation
            elif echo "$SUBJECT" | grep -qE "^docs(\(.*\))?:"; then
              CLEAN=$(echo "$SUBJECT" | sed 's/^docs[^:]*: //')
              DOCS="${DOCS}\n- ${CLEAN}"
            # Chores
            elif echo "$SUBJECT" | grep -qE "^chore(\(.*\))?:"; then
              CLEAN=$(echo "$SUBJECT" | sed 's/^chore[^:]*: //')
              CHORES="${CHORES}\n- ${CLEAN}"
            else
              OTHER="${OTHER}\n- ${SUBJECT}"
            fi
          done <<< "$COMMITS"
          
          # Build changelog entry
          echo "## [${NEW_VERSION}] - ${DATE}" > /tmp/changelog_entry.md
          echo "" >> /tmp/changelog_entry.md
          
          if [ -n "$BREAKING" ]; then
            echo "### BREAKING CHANGES" >> /tmp/changelog_entry.md
            echo -e "$BREAKING" >> /tmp/changelog_entry.md
            echo "" >> /tmp/changelog_entry.md
          fi
          
          if [ -n "$FEATURES" ]; then
            echo "### Features" >> /tmp/changelog_entry.md
            echo -e "$FEATURES" >> /tmp/changelog_entry.md
            echo "" >> /tmp/changelog_entry.md
          fi
          
          if [ -n "$FIXES" ]; then
            echo "### Bug Fixes" >> /tmp/changelog_entry.md
            echo -e "$FIXES" >> /tmp/changelog_entry.md
            echo "" >> /tmp/changelog_entry.md
          fi
          
          if [ -n "$DOCS" ]; then
            echo "### Documentation" >> /tmp/changelog_entry.md
            echo -e "$DOCS" >> /tmp/changelog_entry.md
            echo "" >> /tmp/changelog_entry.md
          fi
          
          if [ -n "$CHORES" ]; then
            echo "### Chores" >> /tmp/changelog_entry.md
            echo -e "$CHORES" >> /tmp/changelog_entry.md
            echo "" >> /tmp/changelog_entry.md
          fi
          
          if [ -n "$OTHER" ]; then
            echo "### Other Changes" >> /tmp/changelog_entry.md
            echo -e "$OTHER" >> /tmp/changelog_entry.md
            echo "" >> /tmp/changelog_entry.md
          fi
          
          # Prepend to existing CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Create temp file with new entry + existing content
            (cat /tmp/changelog_entry.md; echo ""; cat CHANGELOG.md) > /tmp/changelog_temp.md
            mv /tmp/changelog_temp.md CHANGELOG.md
          else
            # Create new CHANGELOG
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat /tmp/changelog_entry.md >> CHANGELOG.md
          fi
          
          echo "CHANGELOG.md updated"
      
      - name: Check for uncommitted changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected - skipping commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected - will commit"
          fi
      
      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          NEW_VERSION="${{ steps.new-version.outputs.version }}"
          
          git add pom.xml CHANGELOG.md scripts/ README.md
          git commit -m "chore(release): bump version to ${NEW_VERSION}"
          
          # Try to push - will fail if there's a conflict
          if ! git push origin main; then
            echo "::error::Failed to push version bump commit. Repository state changed during workflow execution."
            exit 1
          fi
      
      - name: Create and push tag
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          NEW_VERSION="${{ steps.new-version.outputs.version }}"
          
          git tag ${NEW_VERSION}
          
          if ! git push origin ${NEW_VERSION}; then
            echo "::error::Failed to push tag ${NEW_VERSION}"
            exit 1
          fi
          
          echo "Created and pushed tag: ${NEW_VERSION}"
      
      - name: Summary
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          echo "### Version Bump Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous Version**: ${{ steps.current-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: ${{ steps.new-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type**: ${{ steps.bump-type.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created**: ${{ steps.new-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
